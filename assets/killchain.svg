<circle cx="450" cy="92" r="20" fill="#ff2e88" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;.25;0;0" keyTimes="0;0.428;0.429;0.549;0.589;1"/></circle>
<text x="450" y="97" text-anchor="middle" class="n">4</text></g>
<g><circle cx="577" cy="92" r="20" fill="#0b1220" stroke="#1f3350" stroke-width="2"/>
<circle cx="577" cy="92" r="20" fill="#ff2e88" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;.25;0;0" keyTimes="0;0.570;0.571;0.691;0.731;1"/></circle>
<text x="577" y="97" text-anchor="middle" class="n">5</text></g>
<g><circle cx="703" cy="92" r="20" fill="#0b1220" stroke="#1f3350" stroke-width="2"/>
<circle cx="703" cy="92" r="20" fill="#ff2e88" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;.25;0;0" keyTimes="0;0.713;0.714;0.834;0.874;1"/></circle>
<text x="703" y="97" text-anchor="middle" class="n">6</text></g>
<g><circle cx="830" cy="92" r="20" fill="#0b1220" stroke="#1f3350" stroke-width="2"/>
<circle cx="830" cy="92" r="20" fill="#ff2e88" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;.25;0;0" keyTimes="0;0.856;0.857;0.977;0.990;1"/></circle>
