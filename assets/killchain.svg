<text x="450" y="166" text-anchor="middle" class="d">patching</text>
<text x="577" y="140" text-anchor="middle" class="a">Install</text>
<text x="577" y="166" text-anchor="middle" class="d">EDR</text>
<text x="703" y="140" text-anchor="middle" class="a">C2</text>
<text x="703" y="166" text-anchor="middle" class="d">net detect</text>
<text x="830" y="140" text-anchor="middle" class="a">Actions</text>
<text x="830" y="166" text-anchor="middle" class="d">IR playbook</text>

<circle r="5" fill="#fff"><animateMotion dur="10s" repeatCount="indefinite" path="M70 92H830" keyTimes="0;1" keyPoints="0;1" calcMode="linear"/></circle>
<text x="450" y="196" text-anchor="middle" class="t">think like the first, build like the second</text>
</g>
<rect x=".5" y=".5" width="899" height="209" rx="18" fill="none" stroke="#1f3350"/>
