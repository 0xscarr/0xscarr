<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Kill chain: seven attacker stages, each paired with a defender control.">
<defs><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.n{font-size:14px;fill:#9fb3cc;font-weight:700}
.a{font-size:14px;fill:#ff2e88;font-weight:700}
.d{font-size:12px;fill:#39ff88}
.t{font-size:12px;fill:#6b7f99}
</style>
<clipPath id="kc"><rect width="900" height="210" rx="18"/></clipPath></defs>
<g clip-path="url(#kc)">
<rect width="900" height="210" fill="#05070d"/>
<text x="30" y="34" class="t">// attacker view (pink) vs defender answer (green)</text>
<path d="M70 92H830" stroke="#1f3350" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
<g><circle cx="70" cy="92" r="20" fill="#0b1220" stroke="#1f3350" stroke-width="2"/>
<circle cx="70" cy="92" r="20" fill="#ff2e88" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;.25;0;0" keyTimes="0;0.000;0.000;0.120;0.160;1"/></circle>
<text x="70" y="97" text-anchor="middle" class="n">1</text></g>
<g><circle cx="197" cy="92" r="20" fill="#0b1220" stroke="#1f3350" stroke-width="2"/>
<circle cx="197" cy="92" r="20" fill="#ff2e88" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;.25;0;0" keyTimes="0;0.142;0.143;0.263;0.303;1"/></circle>
<text x="197" y="97" text-anchor="middle" class="n">2</text></g>
<g><circle cx="323" cy="92" r="20" fill="#0b1220" stroke="#1f3350" stroke-width="2"/>
<circle cx="323" cy="92" r="20" fill="#ff2e88" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;.9;.25;0;0" keyTimes="0;0.285;0.286;0.406;0.446;1"/></circle>
<text x="323" y="97" text-anchor="middle" class="n">3</text></g>
