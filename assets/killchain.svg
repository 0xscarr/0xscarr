<text x="70" y="140" text-anchor="middle" class="a">Recon</text>
<text x="70" y="166" text-anchor="middle" class="d">threat intel</text>
<text x="197" y="140" text-anchor="middle" class="a">Weaponize</text>
<text x="197" y="166" text-anchor="middle" class="d">sandbox</text>
<text x="323" y="140" text-anchor="middle" class="a">Deliver</text>
<text x="323" y="166" text-anchor="middle" class="d">mail filter</text>
