<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Heartbeat line">
<defs><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.b{stroke-dasharray:260 1400;animation:run 4s linear infinite}
@keyframes run{from{stroke-dashoffset:260}to{stroke-dashoffset:-1400}}
.t{font-size:13px;fill:#6b7f99}
@media (prefers-reduced-motion:reduce){.b{animation:none;stroke-dasharray:none}}
</style>
<linearGradient id="hf" x1="0" x2="1"><stop offset="0" stop-color="#05070d"/><stop offset=".1" stop-color="#05070d" stop-opacity="0"/><stop offset=".9" stop-color="#05070d" stop-opacity="0"/><stop offset="1" stop-color="#05070d"/></linearGradient>
<clipPath id="fc"><rect width="900" height="110" rx="18"/></clipPath></defs>
<g clip-path="url(#fc)">
<rect width="900" height="110" fill="#05070d"/>
<path d="M0 60H180l12-6 10 6h30l10-4 8 4h40l10 0 8-40 10 80 10-60 8 20h60l12-8 10 8h90l12-6 10 6h40l10-40 10 70 10-30h110l12-6 10 6H900" fill="none" stroke="#1b2a3f" stroke-width="2"/>
<path class="b" d="M0 60H180l12-6 10 6h30l10-4 8 4h40l10 0 8-40 10 80 10-60 8 20h60l12-8 10 8h90l12-6 10 6h40l10-40 10 70 10-30h110l12-6 10 6H900" fill="none" stroke="#39ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect width="900" height="110" fill="url(#hf)"/>
